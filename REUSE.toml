# SPDX-License-Identifier: Apache-2.0
#
# REUSE specification 3.3+ metadata (`.reuse/dep5` is deprecated).
#
# Every other file carries its license in its own SPDX header, or in a
# `<file>.license` sidecar where the format allows no comments. That is
# deliberate: antsibull-nox's license check reads per-file headers only and
# ignores this file, and per-file headers are the only way to record the
# provenance of an individual file - one adapted from an upstream project keeps
# the upstream license, which a path glob here could not express. See
# .claude/rules/licensing.md.
#
# Changelog fragments are the one exception. antsibull-nox exempts them from
# needing a header, but `reuse lint` still requires licensing information, so
# they are annotated in bulk here - the same arrangement community.general
# uses.
version = 1

[[annotations]]
path = "changelogs/fragments/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the silexdata.meraki collection"
SPDX-License-Identifier = "Apache-2.0"

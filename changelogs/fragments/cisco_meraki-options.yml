---
bugfixes:
  - cisco_meraki - authenticate with the ``meraki_api_key`` set in the inventory source. Only the ``MERAKI_DASHBOARD_API_KEY`` environment variable
    was used before.
  - cisco_meraki - query the ``meraki_base_url`` set in the inventory source. The default Dashboard API URL was always used before.
  - cisco_meraki - include every organization and network. Only the first page the Dashboard API returned was used before, which is at most 1000
    networks per organization.
  - cisco_meraki - honor ``strict`` for ``compose``. An expression using an undefined variable failed the inventory even with ``strict`` set to false.
  - cisco_meraki - use the inventory cache when ``cache`` is enabled. It was never read or written before.
  - cisco_meraki - name the Dashboard API URL in the error when the API cannot be read.
